    @keyframes latido{
      0%{transform:scale(1);}

      20%{transform:scale(1);}
      30%{transform:scale(1.035);}
      42%{transform:scale(1);}

      45%{transform:scale(1.18);opacity:0;}
      100%{transform:scale(.96);opacity:0;}
    }

    .latido-halo{animation:latidoHalo 1.9s ease-in-out infinite;}
    .anim{animation:fadeUp .28s ease both;}

/* ═══════════════════════════════════════════════════════════
   BACKEND COMPARTIDO (Apps Script + Google Sheets) · opcional
   ───────────────────────────────────────────────────────────
   Vacío = modo local por navegador (idéntico al comportamiento
   anterior). Pega aquí la URL /exec una vez desplegado el backend
   — ver SETUP_BACKEND.md — para que el panel padre y las pantallas
   de sector compartan una sola configuración y un solo histórico.
   ═══════════════════════════════════════════════════════════ */
const BACKEND_URL = "https://script.google.com/macros/s/AKfycbx6XL1-n0ZQjI472b6ng6rfUbZL8tepNxt47igX9N-mZoQ0ZofbC4u7cQk0zMPVUTDv/exec";

/* Clave que se envía automáticamente al backend al guardar configuración —
   sin pedirla en pantalla, para que el acceso quede abierto por ahora.
   Debe coincidir con el hash guardado en CONFIG_DEFAULT.hashClave (ver pB.js)
   y con lo que valide Codigo.gs en el servidor. Cuando definan un modelo de
   acceso real, este es el punto a reemplazar. */
const CLAVE_BACKEND_AUTOMATICA = "shield2026";

async function apiGet(accion, extra={}){
  if(!BACKEND_URL) return null;
  try{
    const qs=new URLSearchParams({action:accion,...extra}).toString();
    const r=await fetch(`${BACKEND_URL}?${qs}`);
    const j=await r.json();
    return j&&j.ok?j:null;
  }catch(err){ return null; }
}
async function apiPost(accion, cuerpo={}){
  if(!BACKEND_URL) return {ok:false,error:"backend no configurado"};
  try{
    const r=await fetch(BACKEND_URL,{method:"POST",
      headers:{"Content-Type":"text/plain;charset=utf-8"},   // evita preflight CORS en Apps Script
      body:JSON.stringify({action:accion,...cuerpo})});
    return await r.json();
  }catch(err){ return {ok:false,error:String(err)}; }
}

/* ── Importancia de área ─────────────────────────────────────
   No toca el IRM (que mide contaminación) — desplaza los cortes del
   semáforo SOLO para esa área, igual que "aceleración ambiental" no
   toca el IRM, desplaza los días que ve cada variable. Es la misma
   distinción de siempre: esto es tolerancia/política (qué tan rápido
   se exige acción), no una re-estimación del riesgo. "Media" es el
   valor por defecto de toda área sin configurar y tiene ajuste 0, así
   que instalar esta función no reclasifica ningún equipo existente
   hasta que el jefe asigne una importancia distinta.
   ═══════════════════════════════════════════════════════════ */
const IMPORTANCIA_AREA={
  baja:    {label:"Baja",    ajuste: 8,  c:"#94A3B8", d:"Bajo volumen o impacto acotado ante una falla. Más margen antes de exigir acción."},
  media:   {label:"Media",   ajuste: 0,  c:"#3B82F6", d:"Valor por defecto: mismos cortes que el resto de la planta."},
  alta:    {label:"Alta",    ajuste:-8,  c:"#D97706", d:"Alto volumen o impacto relevante. Exige acción con menos margen que el resto."},
  critica: {label:"Crítica", ajuste:-15, c:"#DC2626", d:"Volumen muy alto, daño potencial severo o historial de fallas repetidas. Máxima exigencia."},
};
function importanciaDe(area,cfg){
  return cfg.importanciaAreas?.[area]?.nivel || "media";
}
function cortesDeArea(area,cfg){
  const imp=IMPORTANCIA_AREA[importanciaDe(area,cfg)]||IMPORTANCIA_AREA.media;
  const c=cfg.cortes;
  return {
    medio:Math.max(0,c.medio+imp.ajuste),
    alto:Math.max(0,c.alto+imp.ajuste),
    critico:Math.max(0,c.critico+imp.ajuste),
  };
}

const AMBIENTE_DEFAULT = { temp:22, humedad:55, actualizado:null, por:null };

/* ── Modo piloto ───────────────────────────────────────────
   Con piloto.activo=false (por defecto), todos los equipos se
   protegen normalmente — comportamiento idéntico al de siempre.
   Con piloto.activo=true, solo los equipos de piloto.areas o
   piloto.equipos quedan con el algoritmo corriendo; el resto se
   muestra "congelado" (nivel piloto_fuera): sin IRM, sin protocolo,
   con una etiqueta explícita para que nadie lo confunda con "seguro" —
   es "no lo estamos midiendo todavía", no "está bien". */
function enPiloto(eq,cfg){
  const p=cfg.piloto;
  if(!p||!p.activo) return true;
  return (p.areas||[]).includes(eq.area) || (p.equipos||[]).includes(eq.id);
}

/* ── Motor de cálculo ─────────────────────────────────────── */
function evalVar(v, val){
  if(val===null||val===undefined||val==="") return {r:v.sinDato, txt:"Sin dato", sinDato:true};
  const n=Number(val);
  if(Number.isNaN(n)) return {r:v.sinDato, txt:"Sin dato", sinDato:true};
  for(let i=0;i<v.tramos.length;i++){
    const t=v.tramos[i];
    if(t.lim===null||t.lim===undefined) return {r:t.r, txt:t.txt, sinDato:false};
    if(v.dir==="desc"){ if(n>=t.lim) return {r:t.r, txt:t.txt, sinDato:false}; }
    else { if(n<t.lim) return {r:t.r, txt:t.txt, sinDato:false}; }
  }
  const u=v.tramos[v.tramos.length-1];
  return {r:u.r, txt:u.txt, sinDato:false};
}

function calcIRM(eq, cfg, ambiente){
  if(eq.notas==="INHABILITADO") return {irm:0, nivel:"inhabilitado", detalle:[], base:0, factorT:1};
  if(!enPiloto(eq,cfg)) return {irm:null, nivel:"piloto_fuera", detalle:[], base:0, factorT:1};
  const act=cfg.variables.filter(v=>v.activa);
  const sum=act.reduce((s,v)=>s+(Number(v.peso)||0),0);
  if(!act.length||sum<=0) return {irm:null, nivel:"sinmodelo", detalle:[], base:0, factorT:1};
  const {factorTemp,factorHum,factorTotal}=factorAmbientalDe(ambiente,cfg);
  let base=0; const detalle=[];
  act.forEach(v=>{
    const raw=eq[v.campo];
    const hayDato=raw!==null&&raw!==undefined&&raw!==""&&!Number.isNaN(Number(raw));
    const acelera=!!(v.tiempoDependiente&&cfg.factorAmbiental?.activo&&hayDato);
    const valEval=acelera?Number(raw)*factorTotal:raw;
    const ev=evalVar(v, valEval);
    const pesoEf=(Number(v.peso)||0)/sum;
    base+=pesoEf*ev.r;
    detalle.push({id:v.id, nombre:v.nombre, unidad:v.unidad, r:ev.r, txt:ev.txt,
      sinDato:ev.sinDato, pesoEf:Math.round(pesoEf*1000)/10, valor:raw, clase:v.clase,
      acelerado:acelera, factorT:acelera?factorTotal:1, factorTemp, factorHum,
      valorEfectivo:acelera?Math.round(valEval*10)/10:null});
  });
  const irm=Math.max(0,Math.min(100,Math.round(base)));
  const c=cortesDeArea(eq.area,cfg);
  const nivel = irm>=c.critico?"critico" : irm>=c.alto?"alto" : irm>=c.medio?"medio" : "bajo";
  return {irm, nivel, detalle, base:Math.round(base*10)/10, factorT:factorTotal, factorTemp, factorHum, cortesArea:c};
}

/* ── Aceleración ambiental: temperatura × humedad (dato único de planta) ── */
function bandaDe(valor,bandas){
  const n=Number(valor);
  if(valor===null||valor===undefined||Number.isNaN(n)) return 1;
  for(const b of bandas){ if(b.max===null||b.max===undefined||n<b.max) return Number(b.factor)||1; }
  return Number(bandas[bandas.length-1]?.factor)||1;
}
function factorAmbientalDe(ambiente,cfg){
  const fa=cfg.factorAmbiental;
  if(!fa||!fa.activo||!ambiente) return {factorTemp:1,factorHum:1,factorTotal:1};
  const factorTemp=bandaDe(ambiente.temp,fa.temperatura);
  const factorHum=bandaDe(ambiente.humedad,fa.humedad);
  return {factorTemp,factorHum,factorTotal:Math.round(factorTemp*factorHum*100)/100};
}

/* ── Modelo de confianza (nivel de seguridad del algoritmo) ── */
const NIVEL_CONF=[
  {min:85, label:"PREDICTIVO PLENO", c:"#0F8A4C", d:"El modelo anticipa la contaminación con medición directa y continua."},
  {min:70, label:"PREDICTIVO",       c:"#16A34A", d:"Hay medición directa suficiente para decidir antes de que el lote se comprometa."},
  {min:55, label:"SEMI-PREDICTIVO",  c:"#D97706", d:"Predice tendencias, pero depende de proxies indirectos para el diagnóstico final."},
  {min:40, label:"PREVENTIVO",       c:"#EA580C", d:"Ordena y prioriza el trabajo, sin capacidad real de anticipación."},
  {min:0,  label:"REACTIVO",         c:"#DC2626", d:"Equivale al método por calendario que este proyecto vino a reemplazar."},
];
function nivelConf(p){ return NIVEL_CONF.find(n=>p>=n.min)||NIVEL_CONF[NIVEL_CONF.length-1]; }

function calcConfianza(cfg){
  const todas=cfg.variables;
  const denom=todas.reduce((s,v)=>s+(Number(v.pesoRec)||0)*v.poder,0);
  const act=todas.filter(v=>v.activa);
  const cob=act.reduce((s,v)=>s+(Number(v.pesoRec)||0)*v.poder,0);
  const cobertura= denom>0 ? (cob/denom)*100 : 0;
  // Alineación: qué tan cerca están los pesos asignados de la proporción recomendada
  const sumRecAct=act.reduce((s,v)=>s+(Number(v.pesoRec)||0),0);
  const sumAct=act.reduce((s,v)=>s+(Number(v.peso)||0),0);
  let desv=0;
  if(sumRecAct>0&&sumAct>0) act.forEach(v=>{
    desv+=Math.abs((Number(v.peso)/sumAct)-(Number(v.pesoRec)/sumRecAct));
  });
  const alineacion=Math.max(0,1-desv/2);               // 1 = pesos recomendados
  const confianza=Math.round(cobertura*(0.90+0.10*alineacion));
  const perdidas=todas.filter(v=>!v.activa)
    .map(v=>({id:v.id, nombre:v.nombre, pts:Math.round(((Number(v.pesoRec)||0)*v.poder/denom)*100)}))
    .sort((a,b)=>b.pts-a.pts);
  return {confianza:Math.max(0,Math.min(100,confianza)),
          cobertura:Math.round(cobertura),
          alineacion:Math.round(alineacion*100),
          perdidas, nivel:nivelConf(confianza)};
}

/* ── Datos derivados por equipo ───────────────────────────── */
const REF_DATA = new Date(2025,6,10);        // 10-jul-2025 · fecha de corte del set de datos
function diasDesde(s){
  if(!s||s==="—") return null;
  const p=String(s).split("/"); if(p.length!==3) return null;
  const f=new Date(Number(p[2]),Number(p[1])-1,Number(p[0]));
  if(Number.isNaN(f.getTime())) return null;
  return Math.max(0,Math.round((REF_DATA-f)/86400000));
}
function derivar(eq){
  const atp=eq.atp;
  return {
    ...eq,
    dias_paa: eq.dias_h2o2,
    dias_fab: eq.dias_det==null?null:eq.dias_det+(eq.id%4),
    dias_san: diasDesde(eq.ultima_san),
    ph: atp==null?null:Math.round((9.25-(Math.min(atp,3000)/3000)*2.1)*10)/10,
    hist: atp==null?0:(atp>=2000?2:atp>=500?1:0),
    placa:null, biofilm:null, agua:null,
  };
}
function componer(base, ov, cfg, ambiente){
  const pre={...base,...ov};
  const der=derivar(pre);
  const merged={...der,...ov};
  return {...merged, ...calcIRM(merged,cfg,ambiente)};
}

/* ── Clave de acceso (ofuscación, no criptografía) ────────── */
function hashClave(s){
  const salt="shield::codelpa::irm";
  const str=salt+String(s)+salt;
  let h1=0x811c9dc5, h2=0x01000193;
  for(let i=0;i<str.length;i++){
    const c=str.charCodeAt(i);
    h1=Math.imul(h1^c,16777619)>>>0;
    h2=(Math.imul(h2+c*(i+7),2246822519)>>>0);
    h2=(h2^(h2>>>13))>>>0;
  }
  return (h1>>>0).toString(16).padStart(8,"0")+(h2>>>0).toString(16).padStart(8,"0");
}
const LS_KEY="shield_cfg_irm_v6";
function leerCfg(){
  try{ const r=localStorage.getItem(LS_KEY); if(!r) return null;
    const p=JSON.parse(r);
    if(!p||!Array.isArray(p.variables)) return null;
    // fusiona con el catálogo para tolerar versiones antiguas
    // (ids retiradas del modelo en versiones previas: se descartan si aparecen en una config vieja)
    const IDS_RETIRADAS=new Set(["temp","vuln","expo"]);
    const mapa={}; p.variables.forEach(v=>{ if(!IDS_RETIRADAS.has(v.id)) mapa[v.id]=v; });
    const vars=CONFIG_DEFAULT.variables.map(base=>mapa[base.id]?{...base,...mapa[base.id]}:base);
    const extra=p.variables.filter(v=>!IDS_RETIRADAS.has(v.id)&&!CONFIG_DEFAULT.variables.some(b=>b.id===v.id));
    const poderAcciones={...CONFIG_DEFAULT.poderAcciones,...(p.poderAcciones||{})};
    const faOrigen=p.factorAmbiental||p.factorTermico;   // tolera el nombre anterior (factorTermico)
    const factorAmbiental=faOrigen
      ?{...CONFIG_DEFAULT.factorAmbiental,...faOrigen,
        temperatura:faOrigen.temperatura||faOrigen.bandas||CONFIG_DEFAULT.factorAmbiental.temperatura,
        humedad:faOrigen.humedad||CONFIG_DEFAULT.factorAmbiental.humedad}
      :CONFIG_DEFAULT.factorAmbiental;
    const importanciaAreas={...(p.importanciaAreas||{})};
    const piloto={...CONFIG_DEFAULT.piloto,...(p.piloto||{})};
    return {...CONFIG_DEFAULT, ...p, variables:[...vars,...extra], poderAcciones, factorAmbiental, importanciaAreas, piloto};
  }catch(e){ return null; }
}
function guardarCfg(c){ try{ localStorage.setItem(LS_KEY,JSON.stringify(c)); return true; }catch(e){ return false; } }

const LS_KEY_AMB="shield_ambiente_v7";
function leerAmbiente(){
  try{ const r=localStorage.getItem(LS_KEY_AMB); if(!r) return null;
    const p=JSON.parse(r); if(typeof p?.temp!=="number") return null;
    return {...AMBIENTE_DEFAULT, ...p};
  }catch(e){ return null; }
}
function guardarAmbiente(a){ try{ localStorage.setItem(LS_KEY_AMB,JSON.stringify(a)); return true; }catch(e){ return false; } }

function accionesDe(nivel,cfg){
  const activas=new Set(cfg.variables.filter(v=>v.activa).map(v=>v.id));
  const ids=ACCIONES_POR_NIVEL[nivel]||[];
  if(ids.length===0) return [{t:"Sin acciones requeridas",tipo:"normal",req:null,poder:0,
    desc:"El equipo está en rango seguro",mecanismo:"",afecta:{}}];
  return ids.map(id=>{
    const base=ACCIONES_CATALOGO[id];
    const poder=cfg.poderAcciones?.[id]??base.poder;
    return {...base,id,poder};
  })
  .filter(a=>!a.req||activas.has(a.req))
  // Ordena por poder de protección: el operador ve primero lo que más reduce el
  // riesgo, y las mediciones (poder 0) quedan al final. Es lo que hace que el
  // número del panel de configuración sirva para algo operativo y no decorativo.
  .sort((a,b)=>b.poder-a.poder);
}

  return <svg width={size} height={size*(H/W)} viewBox={`0 0 ${W} ${H}`} style={{display:"block",margin:"0 auto"}}>{body}</svg>;
}
function EquipoTile({eq,onClick}){
  const c=NC[eq.nivel]||NC.inhabilitado;
  const [hov,setHov]=useState(false);
  const urg=eq.nivel==="critico"||eq.nivel==="alto";
  const inhab=eq.nivel==="inhabilitado";
  const fueraPiloto=eq.nivel==="piloto_fuera";
  const sinModelo=eq.irm===null;
  const simbolo=inhab?"—":fueraPiloto?"❄":"?";
  return(
    <div role="button" tabIndex={0} onClick={onClick}
      onKeyDown={e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();onClick();}}}
      onMouseEnter={()=>setHov(true)} onMouseLeave={()=>setHov(false)}
      title={`${eq.codigo} · ${eq.area} · ${eq.responsable}`}
      style={{position:"relative",background:"#fff",border:`1px solid ${hov?c.bg:urg?c.bg+"55":CP.line}`,
        borderTop:`3px solid ${urg?c.bg:"transparent"}`,borderRadius:14,padding:"11px 6px 9px",cursor:"pointer",
        textAlign:"center",transition:"transform .12s, box-shadow .12s, border-color .12s",
        transform:hov?"translateY(-2px)":"none",opacity:fueraPiloto?.7:1,
        boxShadow:hov?"0 8px 20px rgba(13,36,64,.13)":"0 1px 2px rgba(13,36,64,.05)"}}>
      <EquipoSVG fig={figuraDe(eq)} fill={inhab||sinModelo?"#CBD5E1":c.bg} stroke={inhab||sinModelo?"#64748B":c.txt}

      <div style={{fontSize:10.5,fontWeight:700,color:CP.navy,marginTop:5,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{eq.codigo}</div>
      <div style={{fontSize:8.5,color:CP.mute,marginTop:1,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{eq.area}</div>

  );
}

function BarraConfianza({cfg,compacto=false}){
  const {confianza,cobertura,alineacion,perdidas,nivel}=useMemo(()=>calcConfianza(cfg),[cfg]);
  const zonas=[{w:40,l:"REACTIVO",c:"#DC2626"},{w:15,l:"PREVENTIVO",c:"#EA580C"},
    {w:15,l:"SEMI-PRED.",c:"#D97706"},{w:15,l:"PREDICTIVO",c:"#16A34A"},{w:15,l:"PLENO",c:"#0F8A4C"}];
  if(compacto) return(
    <div style={{display:"inline-flex",alignItems:"center",gap:8,background:"#fff",border:`1px solid ${CP.line}`,
      borderRadius:20,padding:"5px 12px 5px 8px"}}>
      <Punto c={nivel.c} size={8} glow/>
      <span style={{fontSize:11,fontWeight:800,color:nivel.c}}>{confianza}%</span>
      <span style={{fontSize:10.5,color:CP.mute}}>{nivel.label}</span>
    </div>
  );
  return(
    <div style={{background:"#fff",border:`1px solid ${CP.line}`,borderRadius:16,padding:"16px 18px 14px"}}>
      <div style={{display:"flex",alignItems:"flex-end",justifyContent:"space-between",gap:12,flexWrap:"wrap",marginBottom:14}}>
        <div>
          <div style={{fontSize:9.5,color:CP.mute,fontWeight:700,letterSpacing:1.4}}>NIVEL DE SEGURIDAD DEL MODELO</div>
          <div style={{display:"flex",alignItems:"baseline",gap:9,marginTop:4}}>
            <span style={{fontSize:38,fontWeight:800,color:nivel.c,lineHeight:1,letterSpacing:-1.5}}>{confianza}</span>
            <span style={{fontSize:16,fontWeight:700,color:nivel.c}}>%</span>
            <span style={{fontSize:13,fontWeight:800,color:nivel.c,letterSpacing:.5}}>{nivel.label}</span>
          </div>
          <div style={{fontSize:11.5,color:"#5A6E85",marginTop:5,maxWidth:420,lineHeight:1.5}}>{nivel.d}</div>
        </div>
        <div style={{textAlign:"right"}}>
          <div style={{fontSize:10,color:CP.mute}}>Cobertura de variables <b style={{color:CP.navy}}>{cobertura}%</b></div>
          <div style={{fontSize:10,color:CP.mute,marginTop:2}}>Alineación de pesos <b style={{color:CP.navy}}>{alineacion}%</b></div>
        </div>
      </div>

      <div style={{position:"relative",marginBottom:6}}>
        <div style={{display:"flex",height:11,borderRadius:6,overflow:"hidden",border:`1px solid ${CP.line}`}}>
          {zonas.map((z,i)=><div key={i} style={{width:`${z.w}%`,background:z.c,opacity:.22}}/>)}
        </div>
        <div style={{position:"absolute",top:-4,left:`calc(${confianza}% - 9px)`,transition:"left .45s ease"}}>
          <div style={{width:18,height:18,borderRadius:"50%",background:nivel.c,border:"3px solid #fff",
            boxShadow:"0 2px 8px rgba(13,36,64,.3)"}}/>
        </div>
        <div style={{position:"absolute",top:-5,left:"calc(100% - 7px)"}} title="Configuración recomendada por I+D">
          <div style={{width:12,height:20,borderRadius:3,border:`2px dashed ${CP.navy}`,background:"transparent"}}/>
        </div>
      </div>
      <div style={{display:"flex"}}>
        {zonas.map((z,i)=><div key={i} style={{width:`${z.w}%`,fontSize:8,color:CP.mute,fontWeight:700,
          letterSpacing:.4,paddingLeft:2}}>{z.l}</div>)}
      </div>
      <div style={{display:"flex",justifyContent:"space-between",fontSize:10,color:CP.mute,marginTop:8}}>
        <span>Configuración actual</span>
        <span style={{fontWeight:700,color:CP.navy}}>┆ Recomendado I+D · 100 %</span>
      </div>

      {perdidas.length>0&&<div style={{marginTop:12,paddingTop:12,borderTop:`1px dashed ${CP.line}`}}>
        <div style={{fontSize:10,color:CP.mute,fontWeight:700,letterSpacing:1,marginBottom:7}}>QUÉ ESTÁ LIMITANDO EL MODELO</div>
        <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
          {perdidas.map(p=>(
            <span key={p.id} style={{fontSize:10.5,background:"#FDECEC",color:"#8A2020",border:"1px solid #F6C9C9",
              borderRadius:16,padding:"3px 10px",fontWeight:600}}>{p.nombre} <b>−{p.pts} pts</b></span>
          ))}
        </div>
      </div>}
    </div>
  );
}

function FilaVariable({v,sumaActivas,onChange,onDelete}){
  const [abierto,setAbierto]=useState(false);
  const pesoEf = v.activa&&sumaActivas>0 ? Math.round((Number(v.peso)/sumaActivas)*1000)/10 : 0;
  const directa = v.clase.toLowerCase().startsWith("medición");
  const set=(k,val)=>onChange({...v,[k]:val});
  const setTramo=(i,k,val)=>{
    const t=v.tramos.map((x,j)=>j===i?{...x,[k]:val}:x);
    onChange({...v,tramos:t});
  };
  const eliminar=()=>{
    if(window.confirm(`¿Eliminar "${v.nombre}" del algoritmo? Puedes recuperarla con "Restaurar recomendado".`)) onDelete();
  };
  return(
    <div style={{border:`1px solid ${v.activa?CP.line:"#EDF1F6"}`,borderLeft:`3px solid ${v.activa?(directa?CP.blue:CP.yellow):"#DDE4EC"}`,
      borderRadius:11,background:v.activa?"#fff":"#FAFBFD",marginBottom:6,opacity:v.activa?1:.7}}>
      <div style={{display:"flex",gap:10,padding:"9px 11px",alignItems:"center"}}>
        <button onClick={()=>set("activa",!v.activa)} role="switch" aria-checked={v.activa}
          aria-label={`${v.activa?"Desactivar":"Activar"} ${v.nombre}`}
          style={{width:40,height:23,borderRadius:12,border:"none",cursor:"pointer",flexShrink:0,
            background:v.activa?"#16A34A":"#C7D2DF",position:"relative",transition:"background .2s",padding:0}}>
          <span style={{position:"absolute",top:2.5,left:v.activa?19:2.5,width:18,height:18,borderRadius:"50%",
            background:"#fff",transition:"left .2s",boxShadow:"0 1px 3px rgba(0,0,0,.25)"}}/>
        </button>

        <div style={{flex:1,minWidth:0,cursor:"pointer"}} onClick={()=>setAbierto(a=>!a)}>
          <div style={{display:"flex",alignItems:"center",gap:6,flexWrap:"wrap"}}>
            <span style={{fontSize:13,fontWeight:700,color:CP.navy}}>{v.nombre}</span>
            {v.tiempoDependiente&&<span title="Se acelera con la temperatura/humedad" style={{fontSize:12}}>🌡️</span>}
            {!v.disponible&&<span style={{fontSize:8.5,fontWeight:700,padding:"1px 6px",borderRadius:5,
              background:"#FDECEC",color:"#8A2020"}}>NO DISPONIBLE</span>}
          </div>
          <div style={{fontSize:10,color:CP.mute,marginTop:1}}>{directa?"Medición directa":"Proxy"} · peso {v.peso}%</div>
        </div>

        <input type="number" min="0" max="100" value={v.peso} onClick={e=>e.stopPropagation()}
          onChange={e=>set("peso",Math.max(0,Math.min(100,Number(e.target.value)||0)))}
          style={{width:50,padding:"6px 4px",borderRadius:7,border:`1px solid ${CP.line}`,fontSize:12.5,
            fontWeight:700,color:CP.navy,textAlign:"center",background:"#F8FAFC",flexShrink:0}}/>

        <button onClick={()=>setAbierto(a=>!a)} aria-label="Ver detalles" style={{background:"none",border:"none",
          color:CP.mute,cursor:"pointer",fontSize:13,padding:"4px",flexShrink:0}}>{abierto?"▾":"▸"}</button>
        <button onClick={eliminar} aria-label={`Eliminar ${v.nombre}`} title="Eliminar variable"
          style={{background:"none",border:"none",color:"#C3CEDB",cursor:"pointer",fontSize:13,padding:"4px",flexShrink:0}}>✕</button>
      </div>

      {abierto&&<div style={{padding:"0 14px 13px 61px"}}>
        <div style={{fontSize:11,color:"#5A6E85",lineHeight:1.55,marginBottom:6}}>{v.desc}</div>
        <div style={{fontSize:10,color:CP.mute,marginBottom:9}}>
          poder diagnóstico {v.poder}/100 · fuente: {v.fuente} · recomendado {v.pesoRec}% ·
          efectivo actual <b style={{color:v.activa?CP.blue:CP.mute}}>{pesoEf}%</b>
        </div>
        <div style={{background:"#F8FAFC",border:`1px solid ${CP.line}`,borderRadius:10,padding:"11px 12px"}}>
          <div style={{fontSize:10,color:CP.mute,fontWeight:700,letterSpacing:1,marginBottom:9}}>
            ESCALA DE RIESGO · {v.unidad} · {v.dir==="asc"?"a mayor valor, mayor riesgo":"a menor valor, mayor riesgo"}
          </div>
          {v.tramos.map((t,i)=>(
            <div key={i} style={{display:"flex",alignItems:"center",gap:9,marginBottom:7}}>
              <span style={{fontSize:11,color:"#33455B",width:104,flexShrink:0}}>{t.txt}</span>
              <input type="number" value={t.lim===null||t.lim===undefined?"":t.lim} placeholder="resto"
                onChange={e=>setTramo(i,"lim",e.target.value===""?null:Number(e.target.value))}
                style={{width:70,padding:"5px 7px",borderRadius:7,border:`1px solid ${CP.line}`,fontSize:11.5,
                  color:CP.navy,background:"#fff",textAlign:"center"}}/>
              <span style={{fontSize:10,color:CP.mute}}>→ riesgo</span>
              <input type="number" min="0" max="100" value={t.r}
                onChange={e=>setTramo(i,"r",Math.max(0,Math.min(100,Number(e.target.value)||0)))}
                style={{width:56,padding:"5px 7px",borderRadius:7,border:`1px solid ${CP.line}`,fontSize:11.5,
                  fontWeight:700,color:CP.navy,background:"#fff",textAlign:"center"}}/>
              <div style={{flex:1,minWidth:60}}><BarraEscala v={t.r} c={t.r<35?"#16A34A":t.r<65?"#D97706":"#DC2626"} alto={5}/></div>
            </div>
          ))}
          <div style={{display:"flex",alignItems:"center",gap:9,marginTop:10,paddingTop:9,borderTop:`1px dashed ${CP.line}`}}>
            <span style={{fontSize:11,color:"#33455B",width:104,flexShrink:0}}>Sin dato registrado</span>
            <input type="number" min="0" max="100" value={v.sinDato}
              onChange={e=>set("sinDato",Math.max(0,Math.min(100,Number(e.target.value)||0)))}
              style={{width:56,padding:"5px 7px",borderRadius:7,border:`1px solid ${CP.line}`,fontSize:11.5,
                fontWeight:700,color:CP.navy,background:"#fff",textAlign:"center"}}/>
            <span style={{fontSize:10,color:CP.mute}}>Penalización por no medir.</span>
          </div>
        </div>
      </div>}
    </div>
  );
}

function FormNuevaVariable({onAdd,onCancel}){
  const [f,setF]=useState({nombre:"",unidad:"",peso:10,evidencia:"proxy",dir:"asc",
    t1:{lim:"",r:10},t2:{lim:"",r:50},t3:{r:90}});
  const set=(k,v)=>setF(p=>({...p,[k]:v}));
  const EV={directa:{poder:90,clase:"Medición directa"},indirecta:{poder:65,clase:"Medición indirecta"},proxy:{poder:45,clase:"Proxy de condición"}};
  const crear=()=>{
    if(!f.nombre.trim()) return;
    const ev=EV[f.evidencia];
    const id="cst_"+Date.now().toString(36);
    onAdd({
      id, nombre:f.nombre.trim(), unidad:f.unidad.trim()||"—", campo:id, dir:f.dir,
      clase:ev.clase, poder:ev.poder, pesoRec:Number(f.peso)||10, peso:Number(f.peso)||10,
      activa:true, disponible:true, custom:true, sinDato:55,
      desc:"Variable añadida por el Jefe de I+D. Mientras no exista un campo de captura en planta, todos los equipos la evalúan como «sin dato».",
      fuente:"Definida por I+D",
      tramos:[
        {lim:f.t1.lim===""?null:Number(f.t1.lim),r:Number(f.t1.r)||10,txt:"Tramo bajo"},
        {lim:f.t2.lim===""?null:Number(f.t2.lim),r:Number(f.t2.r)||50,txt:"Tramo medio"},
        {lim:null,r:Number(f.t3.r)||90,txt:"Resto"},
      ],
    });
  };
  const inp={padding:"9px 11px",borderRadius:9,border:`1px solid ${CP.line}`,fontSize:12.5,color:CP.navy,background:"#fff",width:"100%"};
  return(
    <div style={{border:`1px dashed ${CP.blue}`,borderRadius:12,background:CP.blueSoft,padding:"14px 16px",marginBottom:10}}>
      <div style={{fontSize:12.5,fontWeight:700,color:CP.navy,marginBottom:10}}>Nueva variable del algoritmo</div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(150px,1fr))",gap:9,marginBottom:10}}>
        <div><label style={{fontSize:10,color:"#33455B",fontWeight:700,display:"block",marginBottom:4}}>Nombre</label>
          <input style={inp} value={f.nombre} onChange={e=>set("nombre",e.target.value)} placeholder="Ej: Conductividad del enjuague"/></div>
        <div><label style={{fontSize:10,color:"#33455B",fontWeight:700,display:"block",marginBottom:4}}>Unidad</label>
          <input style={inp} value={f.unidad} onChange={e=>set("unidad",e.target.value)} placeholder="Ej: µS/cm"/></div>
        <div><label style={{fontSize:10,color:"#33455B",fontWeight:700,display:"block",marginBottom:4}}>Peso inicial (%)</label>
          <input style={inp} type="number" min="0" max="100" value={f.peso} onChange={e=>set("peso",e.target.value)}/></div>
        <div><label style={{fontSize:10,color:"#33455B",fontWeight:700,display:"block",marginBottom:4}}>Tipo de evidencia</label>
          <select style={inp} value={f.evidencia} onChange={e=>set("evidencia",e.target.value)}>
            <option value="directa">Medición directa (poder 90)</option>
            <option value="indirecta">Medición indirecta (poder 65)</option>
            <option value="proxy">Proxy de condición (poder 45)</option>
          </select></div>
        <div><label style={{fontSize:10,color:"#33455B",fontWeight:700,display:"block",marginBottom:4}}>Dirección</label>
          <select style={inp} value={f.dir} onChange={e=>set("dir",e.target.value)}>
            <option value="asc">A mayor valor, mayor riesgo</option>
            <option value="desc">A menor valor, mayor riesgo</option>
          </select></div>
      </div>
      <div style={{fontSize:10,color:"#33455B",fontWeight:700,marginBottom:6}}>ESCALA (límite del tramo → riesgo 0-100)</div>
      {[["t1","Tramo bajo"],["t2","Tramo medio"]].map(([k,l])=>(
        <div key={k} style={{display:"flex",alignItems:"center",gap:8,marginBottom:6}}>
          <span style={{fontSize:11,color:"#33455B",width:88}}>{l}</span>
          <input type="number" value={f[k].lim} onChange={e=>set(k,{...f[k],lim:e.target.value})} placeholder="límite"
            style={{...inp,width:78}}/>
          <span style={{fontSize:10,color:CP.mute}}>→</span>
          <input type="number" value={f[k].r} onChange={e=>set(k,{...f[k],r:e.target.value})} style={{...inp,width:64}}/>
        </div>
      ))}
      <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:12}}>
        <span style={{fontSize:11,color:"#33455B",width:88}}>Resto</span>
        <span style={{fontSize:11,color:CP.mute,width:78,textAlign:"center"}}>—</span>
        <span style={{fontSize:10,color:CP.mute}}>→</span>
        <input type="number" value={f.t3.r} onChange={e=>set("t3",{r:e.target.value})} style={{...inp,width:64}}/>
      </div>
      <div style={{display:"flex",gap:9}}>
        <button onClick={onCancel} style={{padding:"10px 18px",borderRadius:10,border:`1px solid ${CP.line}`,
          background:"#fff",color:"#5A6E85",fontSize:12.5,fontWeight:600,cursor:"pointer"}}>Cancelar</button>
        <button onClick={crear} style={{padding:"10px 20px",borderRadius:10,border:"none",background:CP.blue,
          color:"#fff",fontSize:12.5,fontWeight:700,cursor:"pointer"}}>Agregar variable</button>
      </div>
    </div>
  );
}

function FilaPilotoArea({area,equiposArea,piloto,onChange}){
  const [abierto,setAbierto]=useState(false);
  const areaCompleta=piloto.areas.includes(area);
  const enEquipos=equiposArea.filter(e=>piloto.equipos.includes(e.id)).length;
  const nIncluidos=areaCompleta?equiposArea.length:enEquipos;
  const toggleArea=()=>{
    const areas=areaCompleta?piloto.areas.filter(a=>a!==area):[...piloto.areas,area];
    onChange({...piloto,areas});
  };
  const toggleEquipo=(id)=>{
    const equipos=piloto.equipos.includes(id)?piloto.equipos.filter(x=>x!==id):[...piloto.equipos,id];
    onChange({...piloto,equipos});
  };
  return(
    <div style={{border:`1px solid ${nIncluidos>0?CP.blue+"44":CP.line}`,borderRadius:11,marginBottom:7,
      background:nIncluidos>0?CP.blueSoft:"#fff",overflow:"hidden"}}>
      <div style={{display:"flex",alignItems:"center",gap:10,padding:"10px 13px"}}>
        <button onClick={toggleArea} role="checkbox" aria-checked={areaCompleta}
          style={{width:20,height:20,borderRadius:6,border:`2px solid ${areaCompleta?CP.blue:"#C7D2DF"}`,
            background:areaCompleta?CP.blue:"#fff",cursor:"pointer",flexShrink:0,display:"flex",
            alignItems:"center",justifyContent:"center",padding:0}}>
          {areaCompleta&&<span style={{color:"#fff",fontSize:12,fontWeight:900}}>✓</span>}
        </button>
        <div style={{flex:1,minWidth:0,cursor:"pointer"}} onClick={()=>setAbierto(a=>!a)}>
          <span style={{fontSize:12.5,fontWeight:700,color:CP.navy}}>{area}</span>
          <span style={{fontSize:11,color:CP.mute,marginLeft:7}}>
            {nIncluidos}/{equiposArea.length} en piloto</span>
        </div>
        <button onClick={()=>setAbierto(a=>!a)} style={{background:"none",border:"none",color:CP.blue,
          fontSize:11,fontWeight:700,cursor:"pointer"}}>{abierto?"Ocultar":"Equipos"}</button>
      </div>
      {abierto&&<div style={{padding:"0 13px 11px",display:"flex",flexDirection:"column",gap:4}}>
        {equiposArea.map(e=>{
          const on=areaCompleta||piloto.equipos.includes(e.id);
          return(
            <label key={e.id} style={{display:"flex",alignItems:"center",gap:8,fontSize:11.5,
              color:areaCompleta?CP.mute:"#33455B",cursor:areaCompleta?"default":"pointer"}}>
              <input type="checkbox" checked={on} disabled={areaCompleta}
                onChange={()=>toggleEquipo(e.id)} style={{width:14,height:14,accentColor:CP.blue}}/>
              {e.codigo}
            </label>
          );
        })}
      </div>}
    </div>
  );
}

function Panel({equipos,cfg,conexion,ambiente,onEntrar,onGuia,onConfig,onAmbiente}){
  const vivos=equipos.filter(e=>e.nivel!=="inhabilitado"&&e.irm!==null);
  const irmP=vivos.length?Math.round(vivos.reduce((s,e)=>s+e.irm,0)/vivos.length):null;
  const c=cfg.cortes;
  const nP=irmP===null?"inhabilitado":irmP>=c.critico?"critico":irmP>=c.alto?"alto":irmP>=c.medio?"medio":"bajo";
  const cuenta=k=>equipos.filter(e=>e.nivel===k).length;
  const rojos=cuenta("critico"), altos=cuenta("alto"), medios=cuenta("medio");
  const bajos=equipos.filter(e=>e.nivel==="bajo"||e.nivel==="inhabilitado").length;
  const [hov,setHov]=useState(false);
  const [hovG,setHovG]=useState(false);
  const nActivas=cfg.variables.filter(v=>v.activa).length;

  return(
    <div style={{minHeight:"100vh",background:CP.bg,display:"flex",flexDirection:"column"}}>
      <div style={{display:"flex",alignItems:"flex-start",justifyContent:"space-between",gap:14,padding:"16px 18px 0"}}>
        <LogoCP size={34}/>
        <button onClick={onConfig} onMouseEnter={()=>setHovG(true)} onMouseLeave={()=>setHovG(false)}
          title="Configuración del algoritmo IRM"
          style={{display:"flex",alignItems:"center",gap:10,background:"#fff",border:`1px solid ${hovG?CP.navy:CP.line}`,
            borderRadius:14,padding:"8px 14px 8px 9px",cursor:"pointer",
            boxShadow:hovG?"0 6px 18px rgba(13,36,64,.14)":"0 1px 3px rgba(13,36,64,.06)",transition:"all .15s"}}>
          <span style={{width:40,height:40,borderRadius:11,background:CP.navy,color:CP.yellow,display:"flex",
            alignItems:"center",justifyContent:"center",flexShrink:0}}>
            <span style={{display:"flex",animation:hovG?"spinSlow 5s linear infinite":"none"}}><Engranaje size={23}/></span>
          </span>
          <span style={{textAlign:"left"}}>
            <span style={{display:"block",fontSize:12.5,fontWeight:700,color:CP.navy,lineHeight:1.25}}>Configuración<br/>de algoritmo</span>
          </span>
        </button>
      </div>

      <div style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",
        padding:"18px 20px 30px",textAlign:"center"}}>
        <div style={{fontSize:20,fontWeight:800,color:CP.navy,letterSpacing:-.4}}>Proyecto Shield</div>
        <div style={{fontSize:11.5,color:CP.blue,fontWeight:600,marginTop:2}}>Protección microbiológica predictiva</div>

        <div style={{marginTop:14,marginBottom:16}}><EscalaIRM/></div>

        {(rojos>0||altos>0)&&<div style={{background:rojos>0?NC.critico.soft:NC.alto.soft,
          border:`1px solid ${rojos>0?NC.critico.bg+"55":NC.alto.bg+"55"}`,borderRadius:12,padding:"10px 18px",
          marginBottom:20,display:"flex",alignItems:"center",gap:11,maxWidth:400,width:"100%"}}>
          <Punto c={rojos>0?NC.critico.bg:NC.alto.bg} size={10} glow/>
          <div style={{textAlign:"left"}}>
            <div style={{fontWeight:700,color:rojos>0?NC.critico.bg:NC.alto.bg,fontSize:12.5}}>
              {rojos>0?"Requiere acción inmediata":"Monitoreo aumentado"}</div>
            <div style={{fontSize:11,color:rojos>0?NC.critico.txt:NC.alto.txt}}>
              {rojos>0?`${rojos} equipo(s) en crítico`:`${altos} equipo(s) en alerta`}</div>
          </div>
        </div>}

        <button onClick={onEntrar} onMouseEnter={()=>setHov(true)} onMouseLeave={()=>setHov(false)}
          aria-label="Ver el estado de la planta"
          style={{background:"none",border:"none",cursor:"pointer",padding:0,position:"relative",
            transform:hov?"translateY(-3px)":"none",transition:"transform .18s"}}>
          {/* halo que se expande con cada latido, detrás del escudo */}
          <span className="latido-halo" aria-hidden="true" style={{position:"absolute",left:"50%",top:"50%",
            width:210,height:210,marginLeft:-105,marginTop:-105,borderRadius:"50%",
            background:`radial-gradient(circle, ${NC[nP].bg}55 0%, ${NC[nP].bg}00 68%)`,pointerEvents:"none"}}/>
          <span className="latido" style={{display:"block",position:"relative",
            filter:`drop-shadow(0 16px 30px ${NC[nP].bg}4D)`}}>
            <svg width="212" height="238" viewBox="0 0 100 112" style={{display:"block"}}>
              <defs><linearGradient id="shg" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stopColor={CP.navy}/><stop offset="100%" stopColor={CP.blue}/></linearGradient></defs>
              <path d="M50 4 L92 19 V52 C92 82 50 108 50 108 C50 108 8 82 8 52 V19 Z"
                fill="url(#shg)" stroke={NC[nP].bg} strokeWidth="4" strokeLinejoin="round"/>
              <text x="50" y="35" textAnchor="middle" fontSize="7.5" fontWeight="600" fill={CP.yellow} letterSpacing="2">ÍNDICE</text>
              <text x="50" y="66" textAnchor="middle" fontSize="31" fontWeight="800" fill={NC[nP].bg}>{irmP===null?"—":irmP}</text>
              <text x="50" y="79" textAnchor="middle" fontSize="6.5" fontWeight="600" fill="#9CB6CE">IRM PLANTA</text>
              <text x="50" y="94" textAnchor="middle" fontSize="6.2" fontWeight="700" fill={CP.yellow}>VER ESTADO ▸</text>
            </svg>
          </span>
        </button>

        <div style={{display:"flex",gap:8,flexWrap:"wrap",justifyContent:"center",marginTop:18}}>
          <div style={{background:"#fff",border:`1px solid ${CP.line}`,borderRadius:12,padding:"9px 14px",
            display:"flex",alignItems:"center",gap:11}}>
            <Semaforo nivel={nP} size="md"/>
            <div style={{textAlign:"left"}}>
              <div style={{fontSize:9,color:CP.mute,fontWeight:700,letterSpacing:1}}>NIVEL DE PLANTA</div>
              <div style={{fontSize:13.5,fontWeight:800,color:NC[nP].bg}}>{NC[nP].label}</div>
              <div style={{fontSize:9.5,color:CP.mute}}>{equipos.length} equipos · {AREAS.length} áreas</div>
            </div>
          </div>
          {[{n:rojos,l:"Críticos",c:NC.critico.bg},{n:altos,l:"Alertas",c:NC.alto.bg},
            {n:medios,l:"Precaución",c:NC.medio.bg},{n:bajos,l:"Óptimos",c:NC.bajo.bg}].map((s,i)=>(
            <div key={i} style={{background:"#fff",border:`1px solid ${CP.line}`,borderRadius:12,padding:"9px 14px",
              textAlign:"center",minWidth:64}}>
              <div style={{fontSize:21,fontWeight:800,color:s.c,lineHeight:1}}>{s.n}</div>
              <div style={{fontSize:9.5,color:CP.mute,fontWeight:600,marginTop:2}}>{s.l}</div>
            </div>
          ))}
        </div>

        <div style={{marginTop:16}}>
          <AmbienteChip ambiente={ambiente} cfg={cfg} onClick={onAmbiente}/>
          {ambiente?.actualizado&&<div style={{fontSize:9.5,color:CP.mute,marginTop:5}}>
            Actualizado {ambiente.actualizado}{ambiente.por?` · ${ambiente.por}`:""}</div>}
        </div>

        <div style={{display:"flex",gap:10,marginTop:14,alignItems:"center",flexWrap:"wrap",justifyContent:"center"}}>
          <BarraConfianza cfg={cfg} compacto/>
          <span style={{fontSize:10.5,color:CP.mute}}>{nActivas} de {cfg.variables.length} variables activas</span>
          <button onClick={onGuia} style={{background:"none",border:"none",color:CP.blue,fontSize:11.5,
            fontWeight:700,cursor:"pointer",textDecoration:"underline"}}>Guía rápida</button>
        </div>

        <div style={{marginTop:14}}><Conexion estado={conexion}/></div>
        <div style={{marginTop:8,fontSize:10,color:CP.mute}}>
          Abraham Duarte (I+D) · José Osorio (Optimización de Procesos)
        </div>
      </div>
    </div>
  );
}

/* ═══════════════════════════════════════════════════════════
   VISTA SECTOR · pantalla de operador (artefacto hijo)
   ───────────────────────────────────────────────────────────
   Deliberadamente más simple que la vista de planta: sin buscador,
   sin selector de área, sin contadores globales. En una pantalla de
   sector los números de toda la planta confunden — el operador solo
   necesita ver SUS equipos y qué hacer con ellos. Tiles grandes,
   pensados para leerse a distancia en un monitor montado en pared.
   ═══════════════════════════════════════════════════════════ */
function VistaSector({equipos,cfg,area,ambiente,conexion,onSelectEquipo}){
  const mios=useMemo(()=>{
    const l=equipos.filter(e=>e.area===area);
    const rank={critico:0,alto:1,medio:2,sinmodelo:3,bajo:4,piloto_fuera:5,inhabilitado:6};
    return [...l].sort((a,b)=>(rank[a.nivel]-rank[b.nivel])||((b.irm??-1)-(a.irm??-1)));
  },[equipos,area]);

  const n=k=>mios.filter(e=>e.nivel===k).length;
  const criticos=n("critico"), altos=n("alto"), medios=n("medio");
  const atender=criticos+altos+medios;
  const responsable=mios[0]?.responsable||"";

  const estado = criticos>0
    ? {c:NC.critico, t:`${criticos} equipo${criticos>1?"s":""} requiere${criticos>1?"n":""} acción inmediata`,
       d:"Toca el equipo para ver el protocolo de sanitización."}
    : altos>0
    ? {c:NC.alto, t:`${altos} equipo${altos>1?"s":""} en alerta`,
       d:"Aplica el protocolo antes de que escale a crítico."}
    : medios>0
    ? {c:NC.medio, t:`${medios} equipo${medios>1?"s":""} en precaución`,
       d:"Dosificación preventiva recomendada en el turno."}
    : {c:NC.bajo, t:`Los ${mios.length} equipos operan en condición segura`,
       d:"Sin acciones requeridas. Mantén el registro al día."};

  return(
    <div style={{minHeight:"100vh",background:CP.bg,display:"flex",flexDirection:"column"}}>
      <div style={{background:CP.navy,padding:"14px 20px",display:"flex",alignItems:"center",gap:16,flexWrap:"wrap"}}>
        <LogoCP size={28}/>
        <div style={{flex:1,minWidth:0}}>
          <div style={{fontSize:9.5,color:CP.yellow,letterSpacing:2,fontWeight:700}}>PROYECTO SHIELD · SECTOR</div>
          <div style={{fontSize:21,fontWeight:800,color:"#fff",lineHeight:1.15,marginTop:1}}>{area}</div>
          <div style={{fontSize:11,color:"#9CB6CE",marginTop:2}}>
            {mios.length} equipo{mios.length!==1?"s":""}{responsable?` · ${responsable}`:""}
          </div>
        </div>
        <div style={{display:"flex",flexDirection:"column",alignItems:"flex-end",gap:6}}>
          <AmbienteChip ambiente={ambiente} cfg={cfg} onClick={null} compacto/>
          <Conexion estado={conexion}/>
        </div>
      </div>

      <div style={{background:estado.c.soft,borderBottom:`1px solid ${estado.c.bg}44`,padding:"14px 20px",
        display:"flex",alignItems:"center",gap:14}}>
        <Punto c={estado.c.bg} size={14} glow/>
        <div>
          <div style={{fontSize:16,fontWeight:800,color:estado.c.bg,lineHeight:1.25}}>{estado.t}</div>
          <div style={{fontSize:12,color:estado.c.txt,marginTop:2}}>{estado.d}</div>
        </div>
      </div>

      <div style={{padding:"18px 20px",flex:1}}>
        <div style={{display:"grid",gap:14,gridTemplateColumns:"repeat(auto-fill,minmax(158px,1fr))"}}>
          {mios.map(eq=>{
            const c=NC[eq.nivel]||NC.inhabilitado;
            const urg=eq.nivel==="critico"||eq.nivel==="alto";
            const sinModelo=eq.irm===null;
            const simbolo=eq.nivel==="inhabilitado"?"—":eq.nivel==="piloto_fuera"?"❄":"?";
            return(
              <div key={eq.id} role="button" tabIndex={0} onClick={()=>onSelectEquipo(eq)}
                onKeyDown={e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();onSelectEquipo(eq);}}}
                style={{background:"#fff",border:`1px solid ${urg?c.bg:CP.line}`,borderTop:`4px solid ${urg?c.bg:"transparent"}`,
                  borderRadius:16,padding:"16px 10px 14px",cursor:"pointer",textAlign:"center",
                  boxShadow:urg?`0 6px 18px ${c.bg}22`:"0 1px 3px rgba(13,36,64,.06)"}}>
                <EquipoSVG fig={figuraDe(eq)} fill={sinModelo?"#CBD5E1":c.bg} stroke={sinModelo?"#64748B":c.txt}
                  valor={sinModelo?simbolo:eq.irm} size={92}/>
                <div style={{fontSize:13,fontWeight:800,color:CP.navy,marginTop:9,lineHeight:1.25}}>{eq.codigo}</div>
                <div style={{fontSize:10,fontWeight:700,color:c.bg,letterSpacing:.5,marginTop:3}}>{c.label}</div>
              </div>
            );
          })}
        </div>
        {mios.length===0&&<div style={{background:"#fff",border:`1px solid ${CP.line}`,borderRadius:14,
          padding:"28px 20px",textAlign:"center"}}>
          <div style={{fontSize:14,fontWeight:700,color:CP.navy}}>Sin equipos en este sector</div>
          <div style={{fontSize:12,color:CP.mute,marginTop:5}}>
            Revisa que el nombre del área en el archivo del sector coincida con los del sistema.</div>
        </div>}
      </div>

      <div style={{padding:"0 20px 18px",fontSize:10.5,color:CP.mute,textAlign:"center"}}>
        {atender>0
          ? "Al completar el protocolo el equipo vuelve a condición segura y queda registrado en la planta."
          : "El estado se actualiza solo. Registra las limpiezas que realices para mantener el índice al día."}
      </div>
    </div>
  );
}

/* ═══════════════════════════════════════════════════════════
   VISTA 2 · PLANTA
   ═══════════════════════════════════════════════════════════ */
function General({equipos,cfg,onSelectEquipo,onBack,areaFija=null,conexion=null,ambiente=null,onAmbiente}){
  const [af,setAf]=useState(areaFija||"TODAS");
  const [bq,setBq]=useState("");
  const [ord,setOrd]=useState("prioridad");
  const [filtroNivel,setFiltroNivel]=useState(null);
  const [verSeguros,setVerSeguros]=useState(false);
  const [verFueraPiloto,setVerFueraPiloto]=useState(false);
  const [modo,setModo]=useState("planta");

  const filtrados=useMemo(()=>{
    let l=af==="TODAS"?equipos:equipos.filter(e=>e.area===af);
    if(filtroNivel) l=l.filter(e=>e.nivel===filtroNivel);
    if(bq){const q=bq.toLowerCase();
      l=l.filter(e=>e.codigo.toLowerCase().includes(q)||e.area.toLowerCase().includes(q)||(e.responsable||"").toLowerCase().includes(q));}
    if(ord==="prioridad") l=[...l].sort((a,b)=>
      NIVELES_ORD.indexOf(a.nivel)-NIVELES_ORD.indexOf(b.nivel) || (b.irm??-1)-(a.irm??-1));
    else if(ord==="irm") l=[...l].sort((a,b)=>(b.irm??-1)-(a.irm??-1));
    else if(ord==="nombre") l=[...l].sort((a,b)=>a.codigo.localeCompare(b.codigo));
    else l=[...l].sort((a,b)=>a.area.localeCompare(b.area)||a.codigo.localeCompare(b.codigo));
    return l;
  },[equipos,af,bq,ord,filtroNivel]);

  const resA=AREAS.map(a=>{const e=equipos.filter(x=>x.area===a);
    const w=e.reduce((m,x)=>((x.irm??0)>(m.irm??0)?x:m),e[0]);return{area:a,count:e.length,worst:w?.nivel||"bajo"};});
  const cuenta=k=>equipos.filter(e=>e.nivel===k).length;
  const chips=[{k:null,l:"Todos",n:equipos.length,c:CP.navy},
    {k:"critico",l:"Críticos",n:cuenta("critico"),c:NC.critico.bg},
    {k:"alto",l:"Alertas",n:cuenta("alto"),c:NC.alto.bg},
    {k:"medio",l:"Precaución",n:cuenta("medio"),c:NC.medio.bg},
    {k:"bajo",l:"Óptimos",n:cuenta("bajo"),c:NC.bajo.bg}];

  const agrupar=af==="TODAS"&&!bq&&!filtroNivel;
  const enRiesgo=agrupar?filtrados.filter(e=>["critico","alto","medio","sinmodelo"].includes(e.nivel)):filtrados;
  const seguros=agrupar?filtrados.filter(e=>e.nivel==="bajo"||e.nivel==="inhabilitado"):[];
  const fueraPiloto=agrupar?filtrados.filter(e=>e.nivel==="piloto_fuera"):[];

  const grid=(items)=>(
    <div style={{display:"grid",gap:modo==="planta"?9:8,
      gridTemplateColumns:modo==="planta"?"repeat(auto-fill,minmax(106px,1fr))":"repeat(auto-fill,minmax(290px,1fr))"}}>
      {items.map(eq=>modo==="planta"
        ?<EquipoTile key={eq.id} eq={eq} onClick={()=>onSelectEquipo(eq)}/>
        :<EquipoCard key={eq.id} eq={eq} onClick={()=>onSelectEquipo(eq)}/>)}
    </div>
  );
  const ctrl={padding:"9px 11px",borderRadius:10,border:`1px solid ${CP.line}`,background:"#fff",
    fontSize:12.5,color:CP.navy,outline:"none"};

  return(
    <div style={{minHeight:"100vh",background:CP.bg}}>
      <Topbar titulo={areaFija?`Sector · ${areaFija}`:"Planta"}
        sub={areaFija?`${equipos.filter(e=>e.area===areaFija).length} equipos · vista de operador`:`${equipos.length} equipos · ${AREAS.length} áreas`}
        onBack={areaFija?null:onBack} backLabel="Panel"
        derecha={<div style={{display:"flex",alignItems:"center",gap:10}}>
          <div style={{display:"flex",background:"rgba(255,255,255,.09)",borderRadius:9,padding:3,gap:2,flexShrink:0}}>
            {[{k:"planta",l:"Planta"},{k:"lista",l:"Lista"}].map(m=>(
              <button key={m.k} onClick={()=>setModo(m.k)} style={{padding:"5px 11px",fontSize:11,fontWeight:700,
                borderRadius:7,cursor:"pointer",border:"none",background:modo===m.k?"#fff":"transparent",
                color:modo===m.k?CP.navy:"#9CB6CE"}}>{m.l}</button>))}
          </div>
        </div>}/>

      <div style={{background:"#fff",borderBottom:`1px solid ${CP.line}`,padding:"8px 14px",display:"flex",
        alignItems:"center",justifyContent:"space-between",gap:10,flexWrap:"wrap"}}>
        {/* En vista de sector la lectura ambiental es de solo lectura: es un dato de planta,
            y 12 tablets escribiéndolo generaría conflictos. Se edita desde el panel general. */}
        <AmbienteChip ambiente={ambiente} cfg={cfg} onClick={areaFija?null:onAmbiente} compacto/>
        {areaFija&&<Conexion estado={conexion}/>}
      </div>

      <div style={{background:"#fff",borderBottom:`1px solid ${CP.line}`,padding:"10px 14px"}}>
        <div style={{display:"flex",gap:7,overflowX:"auto",paddingBottom:2}}>
          {chips.map(ch=>{const on=filtroNivel===ch.k;return(
            <button key={String(ch.k)} onClick={()=>setFiltroNivel(ch.k)}
              style={{flexShrink:0,display:"flex",alignItems:"center",gap:7,padding:"6px 13px",borderRadius:10,
                cursor:"pointer",border:`1px solid ${on?ch.c:CP.line}`,background:on?ch.c+"12":"#fff",
                transition:"all .12s"}}>
              {ch.k&&<Punto c={ch.c} size={7}/>}
              <span style={{fontSize:11.5,fontWeight:on?800:600,color:on?ch.c:"#5A6E85"}}>{ch.l}</span>
              <span style={{fontSize:11.5,fontWeight:800,color:on?ch.c:CP.navy}}>{ch.n}</span>
            </button>);})}
        </div>
      </div>

      <div style={{padding:"12px 14px 0"}}>
        <div style={{display:"flex",gap:8,marginBottom:9,flexWrap:"wrap"}}>
          <input value={bq} onChange={e=>setBq(e.target.value)} placeholder="Buscar equipo, área o responsable"
            style={{...ctrl,flex:1,minWidth:190}}/>
          {areaFija
            ?<div style={{...ctrl,display:"flex",alignItems:"center",gap:7,color:"#5A6E85",fontWeight:600}}>
              <Punto c={CP.blue} size={7}/>{areaFija} — vista fija de sector
            </div>
            :<select value={af} onChange={e=>setAf(e.target.value)} style={{...ctrl,cursor:"pointer",maxWidth:200}}>
              <option value="TODAS">Todas las áreas ({equipos.length})</option>
              {resA.map(r=>{
                const imp=IMPORTANCIA_AREA[importanciaDe(r.area,cfg)];
                return <option key={r.area} value={r.area}>{r.area} ({r.count}){imp.label!=="Media"?` · ${imp.label}`:""}</option>;
              })}
            </select>}
          <select value={ord} onChange={e=>setOrd(e.target.value)} style={{...ctrl,cursor:"pointer"}}>
            <option value="prioridad">Prioridad de atención</option>
            <option value="irm">IRM más alto</option>
            <option value="nombre">Nombre A → Z</option>
            <option value="area">Por área</option>
          </select>
        </div>
      </div>

      <div style={{padding:"4px 14px 34px"}}>
        {agrupar?<>
          {enRiesgo.length>0?<div style={{marginBottom:14}}>
            <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:9}}>
              <span style={{fontSize:11.5,fontWeight:800,color:CP.navy,letterSpacing:.3}}>Requieren atención</span>
              <span style={{fontSize:11,color:CP.mute}}>{enRiesgo.length}</span>
              <div style={{flex:1,height:1,background:CP.line}}/>
            </div>
            {grid(enRiesgo)}
          </div>:
          <div style={{background:NC.bajo.soft,border:`1px solid ${NC.bajo.bg}44`,borderRadius:14,
            padding:"18px 20px",marginBottom:14,textAlign:"center"}}>
            <div style={{fontSize:14,fontWeight:800,color:NC.bajo.bg}}>Sin equipos en riesgo</div>
            <div style={{fontSize:11.5,color:NC.bajo.txt,marginTop:3}}>Toda la planta opera en condición segura</div>
          </div>}

          <div style={{background:"#fff",borderRadius:14,overflow:"hidden",border:`1px solid ${CP.line}`}}>
            <button onClick={()=>setVerSeguros(v=>!v)} style={{width:"100%",display:"flex",alignItems:"center",
              gap:12,padding:"13px 16px",background:"#fff",border:"none",cursor:"pointer"}}>
              <Punto c={NC.bajo.bg} size={10} glow/>
              <div style={{flex:1,textAlign:"left"}}>
                <div style={{fontSize:12.5,fontWeight:700,color:CP.navy}}>{seguros.length} equipos en estado óptimo</div>
                <div style={{fontSize:10.5,color:CP.mute}}>Operación normal, sin acciones requeridas</div>
              </div>
              <span style={{fontSize:11,color:CP.mute,fontWeight:700}}>{verSeguros?"Ocultar ▲":"Ver ▼"}</span>
            </button>
            {verSeguros&&<div style={{padding:"4px 12px 14px",borderTop:`1px solid ${CP.line}`}}>{grid(seguros)}</div>}
          </div>

          {fueraPiloto.length>0&&<div style={{background:"#fff",borderRadius:14,overflow:"hidden",
            border:`1px dashed ${CP.line}`,marginTop:10}}>
            <button onClick={()=>setVerFueraPiloto(v=>!v)} style={{width:"100%",display:"flex",alignItems:"center",
              gap:12,padding:"13px 16px",background:"#F8FAFC",border:"none",cursor:"pointer"}}>
              <span style={{fontSize:16}}>❄️</span>
              <div style={{flex:1,textAlign:"left"}}>
                <div style={{fontSize:12.5,fontWeight:700,color:"#475569"}}>{fueraPiloto.length} equipos fuera del piloto</div>
                <div style={{fontSize:10.5,color:CP.mute}}>No están dentro del alcance activo — no se están midiendo</div>
              </div>
              <span style={{fontSize:11,color:CP.mute,fontWeight:700}}>{verFueraPiloto?"Ocultar ▲":"Ver ▼"}</span>
            </button>
            {verFueraPiloto&&<div style={{padding:"4px 12px 14px",borderTop:`1px solid ${CP.line}`}}>{grid(fueraPiloto)}</div>}
          </div>}
        </>:<>
          {filtrados.length===0
            ?<div style={{background:"#fff",border:`1px solid ${CP.line}`,borderRadius:14,padding:"26px 20px",textAlign:"center"}}>
              <div style={{fontSize:13,fontWeight:700,color:CP.navy}}>Ningún equipo coincide</div>
              <div style={{fontSize:11.5,color:CP.mute,marginTop:4}}>Cambia el área, el nivel o el texto de búsqueda.</div>
            </div>
            :grid(filtrados)}
        </>}
      </div>
    </div>
  );
}

/* ═══════════════════════════════════════════════════════════
   VISTA 3 · DETALLE DE EQUIPO
   ═══════════════════════════════════════════════════════════ */
function FactorFila({d}){
  const color=d.r<35?NC.bajo.bg:d.r<65?NC.medio.bg:d.r<85?NC.alto.bg:NC.critico.bg;
  return(
    <div style={{marginBottom:11}}>
      <div style={{display:"flex",justifyContent:"space-between",gap:10,fontSize:11.5,marginBottom:4}}>
        <span style={{fontWeight:600,color:"#33455B",minWidth:0}}>
          {d.nombre} <span style={{color:CP.mute,fontWeight:500}}>· {d.pesoEf} %</span>
        </span>
        <span style={{color,fontWeight:700,whiteSpace:"nowrap",flexShrink:0}}>
          {d.r} <span style={{color:CP.mute,fontWeight:500}}>· {d.sinDato?"sin dato":d.txt}</span>
        </span>
      </div>
      <BarraEscala v={d.r} c={color}/>
      {d.acelerado&&d.factorT!==1&&<div style={{fontSize:9.5,color:CP.blue,marginTop:3,fontWeight:600}}>
        🌡️ {d.valor} días reales × {d.factorT.toFixed(2)} por temperatura = {d.valorEfectivo} días efectivos
      </div>}
    </div>
  );
}
function EquipoDetalle({eq,cfg,planNivel,completadas,onBack,onAccion,ambiente,backLabel="Planta"}){
  const c=NC[eq.nivel]||NC.inhabilitado;
  const accs=accionesDe(planNivel,cfg);
  const done=completadas[eq.id]||{};
  const todas=accs.length>0&&planNivel!=="bajo"&&accs.every(a=>done[a.t]);
  const sinDatos=(eq.detalle||[]).filter(d=>d.sinDato);
  return(
    <div style={{minHeight:"100vh",background:CP.bg}}>
      <Topbar titulo={eq.codigo} sub={`${eq.area} · ${eq.tipo}`} onBack={onBack} backLabel={backLabel}/>

      <div style={{background:"#fff",margin:"12px 14px",borderRadius:16,overflow:"hidden",border:`1px solid ${CP.line}`}}>
        <div style={{background:CP.navy,padding:"17px 18px"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:14}}>
            <div style={{minWidth:0}}>
              <div style={{fontSize:9.5,color:CP.yellow,letterSpacing:1.8,fontWeight:700}}>{eq.area}</div>
              <div style={{fontSize:18,fontWeight:800,color:"#fff",marginTop:3}}>{eq.codigo}</div>
              <div style={{fontSize:11.5,color:"#9CB6CE",marginTop:3}}>Responsable: {eq.responsable}</div>
              <div style={{marginTop:11,display:"flex",alignItems:"center",gap:7,flexWrap:"wrap"}}>
                <div style={{display:"inline-flex",alignItems:"center",gap:8,background:c.bg+"2E",
                  border:`1px solid ${c.bg}66`,borderRadius:18,padding:"4px 13px"}}>
                  <Punto c={c.bg} size={7}/>
                  <span style={{fontSize:11,fontWeight:700,color:c.bg==="#16A34A"?"#7EE2A8":c.bg}}>{c.label} · IRM {c.tag}</span>
                </div>
                {(()=>{const imp=IMPORTANCIA_AREA[importanciaDe(eq.area,cfg)];
                  return imp.label!=="Media"&&<div title={imp.d} style={{fontSize:10,fontWeight:700,color:imp.c,
                    background:imp.c+"22",border:`1px solid ${imp.c}66`,borderRadius:14,padding:"4px 11px"}}>
                    Área {imp.label}</div>;})()}
              </div>
            </div>
            <div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:9,flexShrink:0}}>
              <div style={{textAlign:"center"}}>
                <div style={{fontSize:40,fontWeight:800,color:c.bg,lineHeight:1}}>{eq.irm===null?"—":eq.irm}</div>
                <div style={{fontSize:9,color:"#9CB6CE",fontWeight:600,letterSpacing:1}}>IRM</div>
              </div>
              <Semaforo nivel={eq.nivel} size="md"/>
            </div>
          </div>
          {todas&&<div style={{marginTop:11,background:"rgba(22,163,74,.24)",border:"1px solid #16A34A",
            borderRadius:10,padding:"8px 13px",fontSize:11.5,fontWeight:700,color:"#8FE9B4"}}>
            Protocolo completado · equipo restaurado a condición segura</div>}
        </div>
        <div style={{padding:"12px 18px",display:"flex",gap:22,flexWrap:"wrap"}}>
          {[["ÚLTIMA SANITIZACIÓN",eq.ultima_san],
            ["AMBIENTE DE PLANTA",`${ambiente?.temp??"—"} °C · ${ambiente?.humedad??"—"}% HR`],
            ["DÍAS DETENIDO",eq.dias_det+" día(s)"],["pH REMANENTE",eq.ph??"—"]].map(([l,v],i)=>(
            <div key={i}>
              <div style={{fontSize:8.5,color:CP.mute,fontWeight:700,letterSpacing:1}}>{l}</div>
              <div style={{fontSize:13,fontWeight:700,color:CP.navy,marginTop:2}}>{v}</div>
            </div>))}
          {eq.notas&&<div>
            <div style={{fontSize:8.5,color:CP.mute,fontWeight:700,letterSpacing:1}}>NOTAS</div>
            <div style={{fontSize:12,fontWeight:600,color:NC.alto.bg,marginTop:2}}>{eq.notas}</div>
          </div>}
        </div>
      </div>

      {eq.nivel==="piloto_fuera"?(
        <div style={{margin:"0 14px 34px",background:"#F8FAFC",border:`1.5px dashed ${CP.line}`,
          borderRadius:14,padding:"22px 20px",textAlign:"center"}}>
          <div style={{fontSize:28,marginBottom:8}}>❄️</div>
          <div style={{fontSize:14,fontWeight:800,color:"#475569"}}>Fuera del piloto</div>
          <div style={{fontSize:12,color:"#64748B",marginTop:6,lineHeight:1.6,maxWidth:340,marginLeft:"auto",marginRight:"auto"}}>
            Este equipo no está dentro del alcance activo de Shield: no se calcula su IRM ni hay protocolo
            disponible. No significa que esté en condición segura — significa que todavía no se está midiendo.
            Actívalo desde el engranaje, en la pestaña "Áreas y prioridad".
          </div>
        </div>
      ):(<>
      <div style={{margin:"0 14px 12px",background:"#fff",borderRadius:14,padding:"15px 18px",border:`1px solid ${CP.line}`}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:10,marginBottom:13,flexWrap:"wrap"}}>
          <span style={{fontSize:10,color:CP.mute,fontWeight:700,letterSpacing:1.4}}>DESCOMPOSICIÓN DEL ÍNDICE</span>
          <BarraConfianza cfg={cfg} compacto/>
        </div>
        {(eq.detalle||[]).length===0
          ?<div style={{fontSize:12,color:CP.mute}}>No hay variables activas en el algoritmo.</div>
          :(eq.detalle||[]).map(d=><FactorFila key={d.id} d={d}/>)}
        <div style={{marginTop:10,background:"#F8FAFC",border:`1px solid ${CP.line}`,borderRadius:9,
          padding:"9px 13px",fontSize:11,color:"#5A6E85",lineHeight:1.6}}>
          Base ponderada <b style={{color:CP.navy}}>{eq.base}</b>
          {" "}→ IRM <b style={{color:c.bg}}>{eq.irm===null?"—":eq.irm}</b>
          {cfg.factorAmbiental?.activo&&eq.factorT&&eq.factorT!==1&&<div style={{marginTop:4,color:CP.blue}}>
            🌡️ Ambiente de planta ({ambiente?.temp}°C · {ambiente?.humedad}% HR) acelera ×{eq.factorT.toFixed(2)}
            {" "}las variables de tiempo sin intervención (temp ×{eq.factorTemp.toFixed(2)} · humedad ×{eq.factorHum.toFixed(2)}).
          </div>}
          {sinDatos.length>0&&<div style={{marginTop:6,color:"#B45309"}}>
            {sinDatos.length} variable(s) sin dato registrado: {sinDatos.map(d=>d.nombre).join(", ")}. Se penalizan hasta que se midan.
          </div>}
        </div>
      </div>

      <div style={{margin:"0 14px 34px",background:"#fff",borderRadius:14,overflow:"hidden",border:`1px solid ${CP.line}`}}>
        <div style={{padding:"13px 16px",borderBottom:`1px solid ${CP.line}`,display:"flex",
          justifyContent:"space-between",alignItems:"center",gap:10}}>
          <span style={{fontSize:10,color:CP.mute,fontWeight:700,letterSpacing:1.4}}>PROTOCOLO DE ACCIONES</span>
          <span style={{fontSize:9.5,background:NC[planNivel].soft,color:NC[planNivel].txt,padding:"3px 9px",
            borderRadius:8,fontWeight:700}}>{NC[planNivel].label}</span>
        </div>
        {accs.map((a,i)=>{
          const ok=!!done[a.t];
          const clickable=!ok&&planNivel!=="bajo";
          return(
            <div key={i} onClick={()=>clickable&&onAccion(a)}
              style={{display:"flex",alignItems:"center",gap:12,padding:"13px 16px",
                borderBottom:i<accs.length-1?`1px solid ${CP.line}`:"none",
                cursor:clickable?"pointer":"default",background:ok?"#F6FBF8":"#fff"}}>
              <div style={{width:26,height:26,borderRadius:"50%",flexShrink:0,display:"flex",alignItems:"center",
                justifyContent:"center",background:ok?NC.bajo.bg:c.bg+"1A",border:`1.5px solid ${ok?NC.bajo.bg:c.bg+"55"}`}}>
                <span style={{color:ok?"#fff":c.bg,fontSize:ok?13:11,fontWeight:800}}>{ok?"✓":i+1}</span>
              </div>
              <div style={{flex:1,minWidth:0}}>
                <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
                  <span style={{fontSize:12.5,fontWeight:ok?500:700,color:ok?CP.mute:CP.navy,
                    textDecoration:ok?"line-through":"none"}}>{a.t}</span>
                  {!ok&&a.poder>0&&<span style={{fontSize:8.5,fontWeight:700,letterSpacing:.3,padding:"2px 7px",
                    borderRadius:6,background:badgePoder(a.poder).bg,color:badgePoder(a.poder).fg,flexShrink:0}}>
                    {badgePoder(a.poder).label}</span>}
                </div>
                <div style={{fontSize:10.5,color:ok?NC.bajo.bg:CP.mute,marginTop:2}}>
                  {ok?`Completado · ${done[a.t].fecha}`:a.desc}</div>
              </div>
              {clickable&&<span style={{fontSize:14,color:"#C3CEDB",flexShrink:0}}>›</span>}
            </div>
          );
        })}
        {todas&&<div style={{padding:"12px 16px",background:NC.bajo.soft,textAlign:"center",
          fontSize:12,fontWeight:700,color:NC.bajo.bg}}>Protocolo completado — equipo protegido</div>}
      </div>
      </>)}
    </div>
  );
}

/* ═══════════════════════════════════════════════════════════
   APP
   ═══════════════════════════════════════════════════════════ */
/* Modo kiosco: index.html?area=DISPERSORAS abre esa área directo,
   sin panel general ni acceso al engranaje de configuración. */
function leerAreaFija(){
  try{
    const p=new URLSearchParams(window.location.search).get("area");
    if(!p) return null;
    return AREAS.find(a=>a.toLowerCase()===p.trim().toLowerCase())||null;
  }catch(e){ return null; }
}

function App(){
  const areaFija=useMemo(leerAreaFija,[]);
  const [cfg,setCfg]=useState(()=>leerCfg()||JSON.parse(JSON.stringify(CONFIG_DEFAULT)));
  const [ambiente,setAmbiente]=useState(()=>leerAmbiente()||{...AMBIENTE_DEFAULT});
  const [ambienteModal,setAmbienteModal]=useState(false);
  const [vista,setVista]=useState(areaFija?"planta":"panel");
  const [sel,setSel]=useState(null);
  const [overrides,setOverrides]=useState({});
  const [completadas,setCompletadas]=useState({});
  const [modalAccion,setModalAccion]=useState(null);
  const [guia,setGuia]=useState(false);
  const [config,setConfig]=useState(false);       // panel de configuración abierto (sin candado por ahora)
  const [bitacora,setBitacora]=useState([]);
  const [fiesta,setFiesta]=useState(null);
  const [conexion,setConexion]=useState(BACKEND_URL?"reintentando":"local");
  const ultimoCfgJson=useRef(null);
  const ultimoOvJson=useRef(null);
  const ultimoAmbJson=useRef(null);

  /* ── Sincronización con el backend ─────────────────────── */
  const refrescar=async()=>{
    if(!BACKEND_URL) return;
    const [c,e,a]=await Promise.all([apiGet("config"),apiGet("equipos"),apiGet("ambiente")]);
    if(!c&&!e&&!a){ setConexion("reintentando"); return; }
    setConexion("conectado");
    if(c&&c.cfg){
      const j=JSON.stringify(c.cfg);
      if(j!==ultimoCfgJson.current){ ultimoCfgJson.current=j; setCfg(c.cfg); }
    }
    if(e&&e.overrides){
      const j=JSON.stringify(e.overrides);
      if(j!==ultimoOvJson.current){ ultimoOvJson.current=j; setOverrides(e.overrides); }
    }
    if(a&&a.temp!=null){
      const nuevoAmb={temp:a.temp,humedad:a.humedad,actualizado:a.actualizadoEn,por:a.actualizadoPor};
      const j=JSON.stringify(nuevoAmb);
      if(j!==ultimoAmbJson.current){ ultimoAmbJson.current=j; setAmbiente(nuevoAmb); }
    }
  };
  useEffect(()=>{
    if(!BACKEND_URL) return;
    refrescar();
    const id=setInterval(refrescar,25000);
    return ()=>clearInterval(id);
  },[]);

  const equipos=useMemo(()=>EQUIPOS_BASE.map(e=>componer(e,overrides[e.id]||{},cfg,ambiente)),[overrides,cfg,ambiente]);
  const planNiveles=useMemo(()=>{
    const m={}; EQUIPOS_BASE.forEach(e=>{const r=componer(e,{},cfg,ambiente); m[e.id]=r.nivel==="sinmodelo"?"bajo":r.nivel;});
    return m;
  },[cfg,ambiente]);
  const eqSel=sel?equipos.find(e=>e.id===sel.id)||null:null;

  const actualizarAmbiente=async(temp,humedad,nombre)=>{
    if(BACKEND_URL){
      const r=await apiPost("actualizarAmbiente",{temp,humedad,nombre});
      if(!r||r.ok===false) return {ok:false,error:(r&&r.error)||"No se pudo contactar al servidor."};
      const nuevoAmb={temp:r.temp,humedad:r.humedad,actualizado:r.actualizadoEn,por:r.actualizadoPor};
      ultimoAmbJson.current=JSON.stringify(nuevoAmb);
      setAmbiente(nuevoAmb); setConexion("conectado");
    } else {
      const nuevoAmb={temp,humedad,actualizado:new Date().toLocaleString("es-CL"),por:nombre};
      setAmbiente(nuevoAmb); guardarAmbiente(nuevoAmb);
    }
    return {ok:true};
  };

  const guardarConfig=async(nuevo,nombre)=>{
    const antes=calcConfianza(cfg).confianza;
    const despues=calcConfianza(nuevo).confianza;
    if(BACKEND_URL){
      const r=await apiPost("guardarConfig",{nombre:nombre||"Sin identificar",clave:CLAVE_BACKEND_AUTOMATICA,cfg:nuevo,
        confianzaAntes:antes,confianzaDespues:despues});
      if(!r||r.ok===false) return {ok:false,error:(r&&r.error)||"No se pudo contactar al servidor."};
      ultimoCfgJson.current=JSON.stringify(r.cfg||nuevo);
      setCfg(r.cfg||nuevo);
      setConexion("conectado");
    } else {
      setCfg(nuevo); guardarCfg(nuevo);
    }
    setBitacora(b=>[{usuario:nombre||"Sin identificar",fecha:new Date().toLocaleString("es-CL"),conf:despues},...b].slice(0,12));
    setConfig(false);
    return {ok:true};
  };

  const completar=async(id,texto,tipo,operador,notas,extra)=>{
    const base=EQUIPOS_BASE.find(e=>e.id===id)||{};
    const plan=planNiveles[id];
    const lista=accionesDe(plan,cfg);
    const prev=completadas[id]||{};
    const nuevo={...prev,[texto]:{operador,notas,fecha:new Date().toLocaleString("es-CL"),tipo}};
    const todo=lista.length>0&&lista.every(a=>!!nuevo[a.t]);
    let ch={...(ACCIONES_POR_TIPO[tipo]?.afecta||{})};
    if(tipo==="medir_atp"&&extra?.atp!=null){ ch={...ch,atp:extra.atp}; }
    else if(tipo==="medir_ph"&&extra?.ph!=null){ ch={...ch,ph:extra.ph}; }
    if(todo){
      const prevO=overrides[id]||{};
      const atpF=extra?.atp!=null?extra.atp:(prevO.atp!=null?prevO.atp:78);
      ch={...ch, dias_det:0, dias_fab:0, dias_paa:0, dias_san:0,
        dias_pig:base.dias_pig!=null?0:null, atp:Math.min(atpF,90),
        hist:0,
        ultima_san:new Date().toLocaleDateString("es-CL")};
    }
    const previoOv=overrides[id]||{};
    let nuevosOv={...previoOv,...ch};
    if(todo) delete nuevosOv.ph;   // deja que el pH se recalcule desde el ATP saneado
    setCompletadas(p=>({...p,[id]:nuevo}));

    if(BACKEND_URL){
      const r=await apiPost("completarAccion",{equipoId:id,equipoCodigo:base.codigo,accion:texto,tipo,
        operador,notas,cambios:ch});
      if(r&&r.ok){
        ultimoOvJson.current=JSON.stringify(r.overrides||{});
        setOverrides(r.overrides||{});
        nuevosOv=(r.overrides&&r.overrides[id])||nuevosOv;
        setConexion("conectado");
      } else {
        setConexion("reintentando");
        setOverrides(p=>({...p,[id]:nuevosOv}));   // aplica localmente mientras se recupera la conexión
      }
    } else {
      setOverrides(p=>({...p,[id]:nuevosOv}));
    }

    const nuevoIrm=componer(base,nuevosOv,cfg,ambiente).irm;
    if(todo){
      const antes=equipos.find(e=>e.id===id)?.irm||0;
      setTimeout(()=>setFiesta({equipo:base,irmAntes:antes,irmAhora:nuevoIrm}),1200);
    }
    return {nuevoIrm,todoCompletado:todo};
  };

  return(
    <div style={{maxWidth:860,margin:"0 auto",position:"relative"}}>
      {guia&&<GuiaModal onClose={()=>setGuia(false)}/>}
      {config&&<ConfigPanel cfgInicial={cfg} bitacora={bitacora} conexion={conexion}
        onGuardar={guardarConfig} onClose={()=>setConfig(false)}/>}
      {modalAccion&&<AccionModal accion={modalAccion.accion} equipo={modalAccion.equipo}
        irmActual={modalAccion.equipo?.irm} onClose={()=>setModalAccion(null)}
        onComplete={completar}/>}
      {fiesta&&<CelebrationModal equipo={fiesta.equipo} irmAntes={fiesta.irmAntes} irmAhora={fiesta.irmAhora}
        onClose={()=>setFiesta(null)}/>}
      {ambienteModal&&<AmbienteModal ambiente={ambiente} cfg={cfg} onClose={()=>setAmbienteModal(false)}
        onGuardar={actualizarAmbiente}/>}

      {!areaFija&&vista==="panel"&&<Panel equipos={equipos} cfg={cfg} conexion={conexion} ambiente={ambiente}
        onEntrar={()=>setVista("planta")} onGuia={()=>setGuia(true)} onConfig={()=>setConfig(true)}
        onAmbiente={()=>setAmbienteModal(true)}/>}
      {vista==="planta"&&(areaFija
        ?<VistaSector equipos={equipos} cfg={cfg} area={areaFija} ambiente={ambiente} conexion={conexion}
          onSelectEquipo={eq=>{setSel(eq);setVista("equipo");}}/>
        :<General equipos={equipos} cfg={cfg} conexion={conexion} ambiente={ambiente}
          onBack={()=>setVista("panel")} onSelectEquipo={eq=>{setSel(eq);setVista("equipo");}}
          onAmbiente={()=>setAmbienteModal(true)}/>)}
      {vista==="equipo"&&eqSel&&<EquipoDetalle eq={eqSel} cfg={cfg} planNivel={planNiveles[eqSel.id]} ambiente={ambiente}
        backLabel={areaFija?"Sector":"Planta"}
        completadas={completadas} onBack={()=>setVista("planta")}
        onAccion={a=>setModalAccion({accion:a,equipo:eqSel})}/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
